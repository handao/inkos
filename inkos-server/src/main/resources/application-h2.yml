spring:
  datasource:
    url: jdbc:h2:mem:inkos_local;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  mail:
    host: localhost
    port: 25
    properties:
      mail.smtp.auth: false
    test-connection: false

inkos:
  jwt:
    secret: dev-h2-secret-key-that-is-at-least-256-bits-long-for-hmac-sha
  allowed-origins: http://localhost:5173,http://localhost:4567
